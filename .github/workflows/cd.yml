name: CI/CD Pipeline

on:
  push:
    branches: [ develop, production ]
  pull_request:
    branches: [ develop, production ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # BƯỚC 2: BUILD DOCKER IMAGE (Chỉ chạy khi push/merge)
  build-image:
    name: Step 2 - Build & Push Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Tên image trên registry bắt buộc viết thường
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # BƯỚC 3: DEPLOY VPS (Chỉ chạy khi Step 2 thành công)
  deploy:
    name: Step 3 - Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-image
    if: github.event_name == 'push'
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Triển khai lên Staging (nhánh develop) ---
      - name: Copy docker-compose.yml to Staging VPS
        if: github.ref_name == 'develop'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "docker-compose.yml"
          target: "/opt/igen-insightface/staging"

      - name: Deploy via SSH to Staging VPS
        if: github.ref_name == 'develop'
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: ENV_FILE_CONTENT
          script: |
            TARGET_DIR="/opt/igen-insightface/staging"
            IMAGE_TAG="develop"
            CONTAINER_NAME="igen-insightface-staging"

            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            echo "$ENV_FILE_CONTENT" > .env

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export COMPOSE_PROJECT_NAME="$CONTAINER_NAME"
            IMAGE_TAG="$IMAGE_TAG" CONTAINER_NAME="$CONTAINER_NAME" docker compose pull

            IMAGE_TAG="$IMAGE_TAG" CONTAINER_NAME="$CONTAINER_NAME" docker compose up -d --remove-orphans

            docker image prune -f

      # --- Triển khai lên Production (nhánh production) ---
      - name: Copy docker-compose.yml to Production VPS
        if: github.ref_name == 'production'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST_PROD }}
          username: ${{ secrets.SSH_USER_PROD }}
          key: ${{ secrets.SSH_KEY_PROD }}
          port: ${{ secrets.SSH_PORT_PROD || '22' }}
          source: "docker-compose.yml"
          target: "/opt/igen-insightface/production"

      - name: Deploy via SSH to Production VPS
        if: github.ref_name == 'production'
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_PROD }}
        with:
          host: ${{ secrets.SSH_HOST_PROD }}
          username: ${{ secrets.SSH_USER_PROD }}
          key: ${{ secrets.SSH_KEY_PROD }}
          port: ${{ secrets.SSH_PORT_PROD || '22' }}
          envs: ENV_FILE_CONTENT
          script: |
            TARGET_DIR="/opt/igen-insightface/production"
            IMAGE_TAG="production"
            CONTAINER_NAME="igen-insightface-production"

            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            echo "$ENV_FILE_CONTENT" > .env

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export COMPOSE_PROJECT_NAME="$CONTAINER_NAME"
            IMAGE_TAG="$IMAGE_TAG" CONTAINER_NAME="$CONTAINER_NAME" docker compose pull

            IMAGE_TAG="$IMAGE_TAG" CONTAINER_NAME="$CONTAINER_NAME" docker compose up -d --remove-orphans

            docker image prune -f
